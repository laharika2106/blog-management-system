<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Blog</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <h1>Add New Blog</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="add-blog.html">Add Blog</a>
        </nav>

    </header>

    <main>

        <form id="blogForm">

            <label>Title</label>
            <input
                type="text"
                id="title"
                placeholder="Enter Blog Title"
                required>

            <label>Author</label>
            <input
                type="text"
                id="author"
                placeholder="Enter Author Name"
                required>

            <label>Content</label>
            <textarea
                id="content"
                rows="8"
                placeholder="Write your blog"
                required></textarea>

            <button id="submitBtn" type="submit">
                 Add Blog
            </button>

        </form>

    </main>

    <footer>
        <p>© 2026 Blog Management System</p>
    </footer>

    <script src="script.js"></script>

</body>

</html>
